<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 604" role="img" aria-labelledby="t d">
<title id="t">How a study session runs</title><desc id="d">Say go. Claude reads NEXT.md, then reviews come first. If there is energy, new material and a small exercise follow; on a tired day it is a brain dump instead. Saying done starts the wrap-up, and you merge the pull request.</desc>
<style>
svg { --bg:#fbf9ff; --ink:#3b3a52; --muted:#6c6a86; --line:#8f8bb0;
 --sky:#dcecfb; --mint:#d9f2e6; --peach:#fde6d8; --lav:#e8e2fa; --butter:#fff3c4; --pink:#fbdde8; --white:#ffffff;
 --peachline:#c98a62; --pinkline:#c4708f; --mintline:#5fa885; }
@media (prefers-color-scheme: dark) { svg {
 --bg:#1d1b2a; --ink:#ebe8f7; --muted:#a9a6c4; --line:#8c88b5;
 --sky:#23405c; --mint:#1f4a3c; --peach:#5a3a2c; --lav:#3a3560; --butter:#54481f; --pink:#5a2d41; --white:#2a2840;
 --peachline:#e0a37b; --pinkline:#e48fb0; --mintline:#6fc29a; } }
.bg { fill: var(--bg); }
.n { stroke: var(--line); stroke-width: 1.3; }
.sky{fill:var(--sky)} .mint{fill:var(--mint);stroke:var(--mintline)} .peach{fill:var(--peach);stroke:var(--peachline);stroke-dasharray:5 3}
.lav{fill:var(--lav)} .butter{fill:var(--butter)} .pink{fill:var(--pink);stroke:var(--pinkline);stroke-dasharray:5 3} .white{fill:var(--white)}
.soft { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 3; }
.e { fill: none; stroke: var(--line); stroke-width: 1.5; }
.ep { fill: none; stroke: var(--pinkline); stroke-width: 1.6; stroke-dasharray: 5 3; }
.eo { fill: none; stroke: var(--peachline); stroke-width: 1.6; stroke-dasharray: 5 3; }
.em { fill: none; stroke: var(--mintline); stroke-width: 1.9; }
text { fill: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.t { font-size: 13px; text-anchor: middle; } .tb { font-size: 13px; font-weight: 700; text-anchor: middle; }
.s { font-size: 11px; text-anchor: middle; fill: var(--muted); } .sl { font-size: 11px; text-anchor: start; fill: var(--muted); }
.sp { font-size: 11px; text-anchor: middle; fill: var(--pinkline); } .so { font-size: 11px; text-anchor: middle; fill: var(--peachline); }
.sm { font-size: 11px; font-weight:700; text-anchor: start; fill: var(--mintline); }
</style>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--line)"/></marker>
<marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--pinkline)"/></marker>
<marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--peachline)"/></marker>
<marker id="am" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="var(--mintline)"/></marker>
</defs>
<rect class="bg" width="360" height="604" rx="12"/>
<rect class="n sky" x="20" y="10" width="220" height="36" rx="8"/><text class="t" x="130.0" y="32.5">“go”, or name a workspace</text>
<line class="e" x1="130" y1="46" x2="130" y2="66" marker-end="url(#a)"/>
<rect class="n white" x="20" y="68" width="220" height="36" rx="8"/><text class="t" x="130.0" y="90.5">Pick the workspace</text>
<text class="sl" x="252" y="83">named one, else</text><text class="sl" x="252" y="97">most overdue</text><line class="e" x1="130" y1="104" x2="130" y2="124" marker-end="url(#a)"/>
<rect class="n butter" x="20" y="126" width="220" height="44" rx="8"/><text class="tb" x="130.0" y="144.5">Read NEXT.md</text><text class="s" x="130.0" y="159.5">your next step, in one sentence</text>
<line class="e" x1="130" y1="170" x2="130" y2="190" marker-end="url(#a)"/>
<rect class="n mint" x="20" y="192" width="220" height="44" rx="8"/><text class="tb" x="130.0" y="210.5">Reviews first</text><text class="s" x="130.0" y="225.5">due items, typed from memory</text>
<line class="ep" x1="240" y1="214" x2="254" y2="214" marker-end="url(#ap)"/><rect class="n pink" x="256" y="196" width="96" height="36" rx="8"/><text class="t" x="304.0" y="210.5">a miss goes</text><text class="s" x="304.0" y="225.5">to gaps.md</text>
<line class="e" x1="130" y1="236" x2="130" y2="256" marker-end="url(#a)"/>
<rect class="n white" x="20" y="258" width="220" height="36" rx="8"/><text class="t" x="130.0" y="280.5">Energy for more?</text>
<line class="eo" x1="240" y1="276" x2="254" y2="276" marker-end="url(#ao)"/><rect class="n peach" x="256" y="256" width="96" height="40" rx="8"/><text class="so" x="304" y="272">no: brain dump,</text><text class="so" x="304" y="286">no new material</text>
<line class="e" x1="130" y1="294" x2="130" y2="324" marker-end="url(#a)"/>
<text class="sl" x="140" y="315">yes</text><rect class="n lav" x="20" y="326" width="220" height="44" rx="8"/><text class="tb" x="130.0" y="344.5">New material</text><text class="s" x="130.0" y="359.5">quiz first, then explain</text>
<line class="e" x1="130" y1="370" x2="130" y2="390" marker-end="url(#a)"/>
<rect class="n white" x="20" y="392" width="220" height="36" rx="8"/><text class="t" x="130.0" y="414.5">A small exercise</text>
<line class="e" x1="130" y1="428" x2="130" y2="448" marker-end="url(#a)"/>
<rect class="n sky" x="20" y="450" width="220" height="76" rx="8"/><text class="tb" x="130.0" y="469.5">Say “done”: wrap-up</text><text class="s" x="130.0" y="484.5">explain it back in your words</text><text class="s" x="130.0" y="499.5">then the record, reviews.md,</text><text class="s" x="130.0" y="514.5">gaps.md, NEXT.md, log and a PR</text>
<path class="eo" d="M 304 296 V 488 H 242" marker-end="url(#ao)"/>
<line class="e" x1="130" y1="526" x2="130" y2="546" marker-end="url(#a)"/>
<rect class="n mint" x="20" y="548" width="220" height="36" rx="8"/><text class="tb" x="130.0" y="570.5">You merge the PR</text>

</svg>
